name: Sync Engineering Feeds

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from GitHub Actions tab anytime

jobs:
  sync:
    name: Sync RSS Feeds to Supabase
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Feed Sync Endpoint
        run: |
          TARGET_URL="${{ secrets.SYNC_URL }}"

          if [ -z "$TARGET_URL" ]; then
            echo "ℹ️  No SYNC_URL configured yet."
            echo "Once your site is live on Vercel or your custom domain, add 'SYNC_URL' in GitHub Repo Settings > Secrets (e.g. https://your-domain.com/api/sync)."
            echo "Skipping sync for now until deployment is live."
            exit 0
          fi

          echo "Triggering feed sync at: $TARGET_URL"

          # Call the sync endpoint with optional SYNC_SECRET header
          HTTP_RESPONSE=$(curl -s -o response.txt -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${{ secrets.SYNC_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 60 \
            "$TARGET_URL" || true)

          echo "HTTP Response Code: $HTTP_RESPONSE"
          cat response.txt || true
